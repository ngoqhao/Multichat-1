<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0f14;--bg2:#13161f;--bg3:#1a1e2e;
  --border:#1e2230;--text:#c8cde6;--muted:#4a506b;
  --accent:#4f6ef7;--purple:#7c5cf6;--green:#22c55e;--red:#ef4444;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}

/* ── Connect Screen ── */
#connectScreen{display:flex;align-items:center;justify-content:center;flex:1;padding:20px}
.connect-box{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--purple));display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;margin-bottom:12px}
.logo h1{font-size:22px;color:#f0f2ff;font-weight:700}
.logo p{font-size:12px;color:var(--muted);margin-top:3px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-group{margin-bottom:14px}
.field-group label{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.field-group input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;transition:border .2s}
.field-group input:focus{border-color:var(--accent)}
.btn-grad{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--purple));border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-grad:hover{opacity:.9}
.hints{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:16px}
.hints .htitle{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.hint-row{display:flex;gap:10px;margin-bottom:4px;font-size:11px}
.hint-cmd{color:var(--accent);font-weight:700;min-width:130px}
.hint-desc{color:var(--muted)}
.err-msg{background:#3a1010;border:1px solid var(--red);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-top:10px;display:none}

/* ── Chat Screen ── */
#chatScreen{display:none;flex-direction:column;height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.status-dot.off{background:var(--red)}
.room-name{font-size:15px;font-weight:700;color:#f0f2ff}
.room-sub{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:30px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.member-btn{background:var(--bg3);color:var(--muted)}
.member-btn.active{background:#283070;color:var(--accent);outline:1px solid var(--accent)}
.leave-btn{background:none;border:1px solid #3d1515;border-radius:8px;padding:5px 13px;color:var(--red);font-size:12px;cursor:pointer}
.leave-btn:hover{background:#3d1515}

.main-area{display:flex;flex:1;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:2px}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* bubbles */
.msg-row{display:flex;margin-bottom:6px}
.msg-row.own{justify-content:flex-end}
.msg-row.other{justify-content:flex-start;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:auto}
.msg-col{max-width:68%}
.msg-col.own{align-items:flex-end;display:flex;flex-direction:column}
.msg-meta{font-size:10px;color:var(--muted);margin-bottom:3px}
.bubble{padding:9px 14px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word}
.bubble.own{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bubble.other{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:10px;color:var(--muted);margin-top:3px}

/* system & pm */
.sys-row{display:flex;justify-content:center;margin:6px 0}
.sys-pill{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:11px;color:var(--muted)}
.pm-row{display:flex;justify-content:center;margin:8px 0}
.pm-card{background:#1e143a;border:1px solid #503480;border-radius:10px;padding:8px 16px;text-align:center}
.pm-tag{font-size:10px;font-weight:700;color:#a855f7;margin-bottom:3px}
.pm-text{font-size:12px;color:var(--text)}

/* member panel */
.member-panel{width:200px;background:var(--bg2);border-left:1px solid var(--border);display:none;flex-direction:column;flex-shrink:0}
.member-panel.show{display:flex}
.member-header{padding:12px 14px;border-bottom:1px solid var(--border)}
.member-header .mh-title{font-size:12px;font-weight:700;color:var(--text)}
.member-header .mh-count{font-size:10px;color:var(--green);margin-top:2px}
.member-list{overflow-y:auto;padding:8px 0;flex:1}
.member-row{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:default}
.member-row:hover{background:var(--bg3)}
.m-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.m-name{font-size:12px;color:var(--text)}
.m-name.self{color:var(--accent);font-weight:700}

/* composer */
.composer{background:var(--bg2);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;flex-shrink:0}
.composer input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text);font-size:13px;outline:none}
.composer input:focus{border-color:var(--accent)}
.send-btn{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn:hover{opacity:.88}
</style>
</head>
<body>

<!-- ═══════════ CONNECT SCREEN ═══════════ -->
<div id="connectScreen">
  <div class="connect-box">
    <div class="logo">
      <div class="logo-icon">MC</div>
      <h1>MultiChat</h1>
      <p>Java WebSocket · Real-time Chat</p>
    </div>
    <div class="card">
      <div class="field-group">
        <label>Tên của bạn</label>
        <input id="inName" type="text" placeholder="Nhập tên...">
      </div>
      <div class="field-group">
        <label>Mật khẩu phòng (nếu có)</label>
        <input id="inPass" type="password" placeholder="Để trống nếu không có">
      </div>
      <button class="btn-grad" onclick="doConnect()">Vào phòng →</button>
      <div class="err-msg" id="errMsg"></div>
    </div>
    <div class="hints">
      <div class="htitle">Lệnh hỗ trợ trong chat</div>
      <div class="hint-row"><span class="hint-cmd">/list</span><span class="hint-desc">Danh sách người online</span></div>
      <div class="hint-row"><span class="hint-cmd">/pm &lt;tên&gt; &lt;tin&gt;</span><span class="hint-desc">Nhắn tin riêng</span></div>
      <div class="hint-row"><span class="hint-cmd">/quit</span><span class="hint-desc">Thoát khỏi phòng</span></div>
    </div>
  </div>
</div>

<!-- ═══════════ CHAT SCREEN ═══════════ -->
<div id="chatScreen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div class="room-name" id="lblRoom">Phòng chat</div>
        <div class="room-sub" id="lblSub">Đang kết nối...</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn member-btn" id="btnMembers" onclick="toggleMembers()" title="Danh sách thành viên">👥</button>
      <button class="leave-btn" onclick="doLeave()">Ngắt kết nối</button>
    </div>
  </div>

  <div class="main-area">
    <div class="messages" id="msgArea"></div>
    <div class="member-panel" id="memberPanel">
      <div class="member-header">
        <div class="mh-title">Thành viên</div>
        <div class="mh-count" id="onlineCount">0 người trực tuyến</div>
      </div>
      <div class="member-list" id="memberList"></div>
    </div>
  </div>

  <div class="composer">
    <input id="msgInput" placeholder="Nhập tin nhắn... (Enter để gửi)" onkeydown="if(event.key==='Enter')doSend()">
    <button class="send-btn" onclick="doSend()">➤</button>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────
let ws = null;
let myUsername = '';
let memberVisible = false;

const COLORS = [
  ['#2a3a7a','#4f6ef7'],['#3a1f5a','#8b5cf6'],['#1a3a2a','#22c55e'],
  ['#3a2a1a','#f59e0b'],['#3a1a1a','#ef4444'],['#1a2a3a','#14b8a6']
];

// ── Connect ─────────────────────────────────────────
function getWsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return proto + '//' + location.host + '/ws/chat';
}

function doConnect() {
  const name = document.getElementById('inName').value.trim() || 'Guest';
  const pass = document.getElementById('inPass').value.trim();
  hideErr();

  ws = new WebSocket(getWsUrl());

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', username: name, password: pass }));
  };

  ws.onmessage = e => handleMsg(JSON.parse(e.data));

  ws.onclose = () => {
    setDot(false);
    if (myUsername) addSys('Mất kết nối với server.');
  };

  ws.onerror = () => showErr('Không thể kết nối. Kiểm tra server có đang chạy không.');
}

function handleMsg(data) {
  switch(data.type) {
    case 'need_join': break; // handled by first message

    case 'room_info':
      myUsername = data.username;
      document.getElementById('lblRoom').textContent = data.roomName;
      document.getElementById('lblSub').textContent = data.username;
      setDot(true);
      showChat();
      addSys(data.welcome);
      break;

    case 'error':
      showErr(data.text);
      ws.close(); ws = null;
      break;

    case 'chat':
      if (data.sender === myUsername) addOwnBubble(data.text, data.ts);
      else addOtherBubble(data.sender, data.text, data.ts);
      break;

    case 'system':
      if (data.text.includes('Online (')) updateMembers(data.text);
      addSys(data.text);
      break;

    case 'pm':
      addPm(data);
      break;

    case 'kicked':
      myUsername = '';
      ws.close(); ws = null;
      doLeave(true);
      alert('Bạn đã bị Admin kick khỏi phòng!');
      break;
  }
}

// ── Send ────────────────────────────────────────────
function doSend() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text || !ws) return;
  ws.send(JSON.stringify({ type: 'chat', text }));
  inp.value = '';
}

// ── Leave ────────────────────────────────────────────
function doLeave(kicked = false) {
  if (ws) { try { ws.close(); } catch(e){} ws = null; }
  myUsername = '';
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('connectScreen').style.display = 'flex';
  document.getElementById('msgArea').innerHTML = '';
  document.getElementById('memberList').innerHTML = '';
  document.getElementById('onlineCount').textContent = '0 người trực tuyến';
  setDot(false);
}

// ── UI helpers ───────────────────────────────────────
function showChat() {
  document.getElementById('connectScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('msgInput').focus();
}

function toggleMembers() {
  memberVisible = !memberVisible;
  document.getElementById('memberPanel').classList.toggle('show', memberVisible);
  document.getElementById('btnMembers').classList.toggle('active', memberVisible);
}

function setDot(on) {
  document.getElementById('statusDot').className = 'status-dot' + (on ? '' : ' off');
}

function showErr(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg; el.style.display = 'block';
}
function hideErr() { document.getElementById('errMsg').style.display = 'none'; }

// ── Render messages ──────────────────────────────────
function addOwnBubble(text, ts) {
  const area = document.getElementById('msgArea');
  area.innerHTML += `
    <div class="msg-row own">
      <div class="msg-col own">
        <div class="bubble own">${esc(text)}</div>
        <div class="msg-time">${ts||now()}</div>
      </div>
    </div>`;
  scrollBottom();
}

function addOtherBubble(sender, text, ts) {
  const area = document.getElementById('msgArea');
  const [bg, fg] = COLORS[Math.abs(hashCode(sender)) % COLORS.length];
  const init = sender.substring(0, 2).toUpperCase();
  area.innerHTML += `
    <div class="msg-row other">
      <div class="avatar" style="background:${bg};color:${fg}">${init}</div>
      <div class="msg-col">
        <div class="msg-meta">${esc(sender)} · ${ts||now()}</div>
        <div class="bubble other">${esc(text)}</div>
      </div>
    </div>`;
  scrollBottom();
}

function addSys(text) {
  const area = document.getElementById('msgArea');
  area.innerHTML += `<div class="sys-row"><div class="sys-pill">${esc(text)}</div></div>`;
  scrollBottom();
}

function addPm(data) {
  const area = document.getElementById('msgArea');
  let label = data.dir === 'in'
    ? `PM từ <b>${esc(data.from)}</b>`
    : `PM gửi <b>${esc(data.to)}</b>`;
  area.innerHTML += `
    <div class="pm-row">
      <div class="pm-card">
        <div class="pm-tag">Tin nhắn riêng · ${label}</div>
        <div class="pm-text">${esc(data.text)}</div>
      </div>
    </div>`;
  scrollBottom();
}

function updateMembers(sysText) {
  const m = sysText.match(/Online \((\d+)\): (.+)/);
  if (!m) return;
  const count = parseInt(m[1]);
  const names = m[2].trim() === '(trống)' ? [] : m[2].split(',').map(s => s.trim()).filter(Boolean);
  document.getElementById('onlineCount').textContent = count + ' người trực tuyến';
  const list = document.getElementById('memberList');
  list.innerHTML = names.map(n => `
    <div class="member-row">
      <div class="m-dot"></div>
      <div class="m-name ${n===myUsername?'self':''}">${esc(n)}</div>
    </div>`).join('');
}

function scrollBottom() {
  const area = document.getElementById('msgArea');
  setTimeout(() => area.scrollTop = area.scrollHeight, 30);
}

// ── Utils ────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function now() {
  return new Date().toTimeString().slice(0,5);
}
function hashCode(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return h;
}

// Enter key on connect screen
document.addEventListener('DOMContentLoaded', () => {
  ['inName','inPass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doConnect();
    });
  });
});
</script>
</body>
</html>
